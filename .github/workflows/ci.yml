name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs the pascal and showcase templates' browser tests too; they are too slow for every pull request.
  workflow_dispatch:

jobs:
  template:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [listing, pascal, showcase, minimal]
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.template }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
        if: matrix.template == 'showcase'
      - run: npm run build
        if: matrix.template != 'listing'
      # pascal's and showcase's own build check; listing and minimal have none.
      - run: npm run check
        if: matrix.template == 'pascal' || matrix.template == 'showcase'
      # npm ls exits 1 for an empty filtered list; validate the JSON explicitly.
      - name: Verify editor and Next are absent
        if: matrix.template != 'listing'
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process'
          const result = spawnSync('npm', ['ls', '@pascal-app/editor', 'next', '--all', '--json'], { encoding: 'utf8' })
          console.log(result.stdout)
          const tree = JSON.parse(result.stdout)
          if (result.error || tree.error || tree.errors || Object.keys(tree.dependencies || {}).length || ![0, 1].includes(result.status)) process.exit(1)
          JS
      # pascal and showcase render full 3D scenes; without a GPU that takes minutes, so their browser tests run
      # on the author's machine before a pull request and here only on a manual run.
      - run: npx playwright install --with-deps chromium
        if: (matrix.template != 'pascal' && matrix.template != 'showcase') || github.event_name == 'workflow_dispatch'
      - run: npm run test:e2e
        if: (matrix.template != 'pascal' && matrix.template != 'showcase') || github.event_name == 'workflow_dispatch'
      - run: npm run deploy:dry
        if: matrix.template == 'pascal' || matrix.template == 'showcase'
        env:
          VIEWER_ID: viewer_dryrun

  # Pascal's own Showcase, Listing and Minimal viewers (showcase., listing. and minimal.pascal-viewer.app) follow main.
  # Needs the secret PASCAL_API_KEY (an API key of Pascal's workspace) and the variables
  # SHOWCASE_VIEWER_ID, LISTING_VIEWER_ID and MINIMAL_VIEWER_ID; a template without its variable is skipped.
  deploy:
    name: deploy ${{ matrix.template }}
    needs: [template, shared-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.template }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: showcase
            viewer: SHOWCASE_VIEWER_ID
          - template: listing
            viewer: LISTING_VIEWER_ID
          - template: minimal
            viewer: MINIMAL_VIEWER_ID
    env:
      VIEWER_ID: ${{ vars[matrix.viewer] }}
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - if: env.VIEWER_ID == ''
        working-directory: .
        run: echo "::notice::${{ matrix.viewer }} is not set; ${{ matrix.template }} is not deployed."
      - uses: actions/checkout@v4
        if: env.VIEWER_ID != ''
      - uses: actions/setup-node@v4
        if: env.VIEWER_ID != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.template }}/package-lock.json
      - if: env.VIEWER_ID != ''
        run: npm ci
      - if: env.VIEWER_ID != ''
        run: npm run build
      - if: env.VIEWER_ID != ''
        run: npx --yes @pascal-app/cli@1.1.6 viewer deploy dist --viewer "$VIEWER_ID"
        env:
          PASCAL_API_KEY: ${{ secrets.PASCAL_API_KEY }}

  shared-client:
    name: Identical Pascal API clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: diff -r listing/src/pascal pascal/src/pascal
      - run: diff -r listing/src/pascal showcase/src/pascal
      - run: diff -r listing/src/pascal minimal/src/pascal
      - run: diff -r listing/src/pascal-react showcase/src/pascal-react
      - run: diff -r listing/src/pascal-react minimal/src/pascal-react
